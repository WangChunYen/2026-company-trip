<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8eb">
    <meta name="description" content="2026 宇宙科技公司活動資訊與線上報名">
    <title>2026 宇宙科技公司｜活動報名</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #26364a;
        --muted: #6b7787;
        --accent: #e88745;
        --accent-dark: #c9612d;
        --teal: #2f8883;
        --paper: #fffdf8;
        --line: #eee5d7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 5% 10%, #ffe9bb 0, transparent 27rem),
          radial-gradient(ellipse at 96% 28%, #dff2e9 0, transparent 25rem),
          #fffaf1;
        color: var(--ink);
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        line-height: 1.65;
      }

      .page-shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      .event-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--teal);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        letter-spacing: 0.02em;
        line-height: 1.2;
      }

      .heading-badge {
        flex: 0 0 auto;
        padding: 9px 16px;
        border: 1px solid #f3d9b2;
        border-radius: 999px;
        background: #fff3dc;
        color: #a65c29;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .cover {
        overflow: hidden;
        margin: 0 0 32px;
        border: 7px solid rgba(255, 255, 255, 0.9);
        border-radius: 26px;
        box-shadow: 0 18px 48px rgba(89, 73, 48, 0.14);
      }

      .cover img {
        display: block;
        width: 100%;
        max-height: 430px;
        aspect-ratio: 2.15 / 1;
        object-fit: cover;
        object-position: center;
      }

      .content-layout {
        display: grid;
        grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
        align-items: start;
        gap: 24px;
      }

      .card {
        border: 1px solid rgba(235, 225, 208, 0.9);
        border-radius: 22px;
        background: rgba(255, 253, 248, 0.94);
        box-shadow: 0 12px 34px rgba(89, 73, 48, 0.08);
      }

      .schedule-card {
        padding: 30px;
      }

      .section-kicker {
        margin: 0 0 4px;
        color: var(--accent-dark);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      h2 {
        margin: 0;
        font-size: 1.55rem;
      }

      .schedule-intro {
        margin: 8px 0 24px;
        color: var(--muted);
      }

      .schedule-list {
        display: grid;
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .schedule-item {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 14px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }

      .schedule-time {
        color: var(--teal);
        font-variant-numeric: tabular-nums;
        font-weight: 800;
      }

      .schedule-name {
        font-weight: 650;
      }

      .registration-card {
        padding: 30px;
      }

      .registration-card h2 {
        margin-bottom: 6px;
      }

      .form-intro {
        margin: 0 0 22px;
        color: var(--muted);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field-wide {
        grid-column: 1 / -1;
      }

      label {
        font-size: 0.92rem;
        font-weight: 700;
      }

      .required {
        color: #c94f3d;
      }

      input {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid #ddd6c9;
        border-radius: 11px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        transition: border-color 140ms ease, box-shadow 140ms ease;
      }

      input::placeholder {
        color: #a0a5aa;
      }

      input:focus {
        border-color: var(--teal);
        outline: none;
        box-shadow: 0 0 0 3px rgba(47, 136, 131, 0.14);
      }

      .submit-button {
        width: 100%;
        min-height: 50px;
        margin-top: 20px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        transition: background 140ms ease, transform 140ms ease;
      }

      .submit-button:hover:not(:disabled) {
        transform: translateY(-1px);
        background: var(--accent-dark);
      }

      .submit-button:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }

      .form-status {
        min-height: 1.6em;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .form-status[data-state="success"] {
        color: #21744f;
      }

      .form-status[data-state="error"] {
        color: #b73c32;
      }

      .privacy-note {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      @media (max-width: 760px) {
        .page-shell {
          width: min(100% - 28px, 560px);
          padding: 30px 0 42px;
        }

        .event-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }

        .cover {
          margin-bottom: 22px;
          border-width: 4px;
          border-radius: 19px;
        }

        .cover img {
          min-height: 210px;
          aspect-ratio: 1.45 / 1;
        }

        .content-layout {
          grid-template-columns: 1fr;
          gap: 18px;
        }

        .schedule-card,
        .registration-card {
          padding: 24px;
        }
      }

      @media (max-width: 420px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .field-wide {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <header class="event-heading">
        <div>
          <p class="eyebrow">2026 COMPANY EVENT</p>
          <h1>2026 宇宙科技公司</h1>
        </div>
        <span class="heading-badge">歡迎報名參加</span>
      </header>

      <figure class="cover">
        <img src="./cover.jpg" alt="活動主視覺橫幅">
      </figure>

      <div class="content-layout">
        <section class="card schedule-card" aria-labelledby="schedule-title">
          <p class="section-kicker">EVENT FLOW</p>
          <h2 id="schedule-title">活動內容</h2>
          <p class="schedule-intro">一起探索新點子，期待與你相見！</p>
          <ol class="schedule-list">
            <li class="schedule-item">
              <span class="schedule-time">8:00</span>
              <span class="schedule-name">報到</span>
            </li>
            <li class="schedule-item">
              <span class="schedule-time">9:00</span>
              <span class="schedule-name">場次一</span>
            </li>
            <li class="schedule-item">
              <span class="schedule-time">10:00</span>
              <span class="schedule-name">break time</span>
            </li>
            <li class="schedule-item">
              <span class="schedule-time">10:30</span>
              <span class="schedule-name">場次二</span>
            </li>
            <li class="schedule-item">
              <span class="schedule-time">11:30</span>
              <span class="schedule-name">Q&amp;A</span>
            </li>
            <li class="schedule-item">
              <span class="schedule-time">12:00</span>
              <span class="schedule-name">活動結束</span>
            </li>
          </ol>
        </section>

        <section class="card registration-card" aria-labelledby="registration-title">
          <p class="section-kicker">SAVE YOUR SEAT</p>
          <h2 id="registration-title">活動報名</h2>
          <p class="form-intro">填寫以下資料完成報名，標示 <span class="required">*</span> 為必填。</p>
          <form id="registration-form" method="post" target="submission-frame">
            <div class="form-grid">
              <div class="field">
                <label for="fullName">姓名 <span class="required">*</span></label>
                <input id="fullName" name="name" autocomplete="name" maxlength="100" required>
              </div>
              <div class="field">
                <label for="email">Email <span class="required">*</span></label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
              </div>
              <div class="field">
                <label for="department">單位</label>
                <input id="department" name="department" autocomplete="organization" maxlength="120">
              </div>
              <div class="field">
                <label for="phone">電話 <span class="required">*</span></label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required>
              </div>
              <div class="field field-wide">
                <label for="jobTitle">職稱</label>
                <input id="jobTitle" name="jobTitle" autocomplete="organization-title" maxlength="120">
              </div>
            </div>
            <input id="request-id" name="requestId" type="hidden">
            <button class="submit-button" id="submit-button" type="submit" disabled>立即報名</button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            <p class="privacy-note">報名資料僅用於本次活動聯繫與行政作業。</p>
          </form>
          <iframe class="visually-hidden" id="submission-frame" name="submission-frame" title="報名送出結果"></iframe>
        </section>
      </div>
    </main>
    <script>
      (() => {
        const scriptUrl = 'YOUR_APPS_SCRIPT_WEB_APP_URL';
        const form = document.getElementById('registration-form');
        const button = document.getElementById('submit-button');
        const status = document.getElementById('form-status');
        const requestIdInput = document.getElementById('request-id');
        const frame = document.getElementById('submission-frame');
        const configured = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(scriptUrl);
        let pendingRequestId = '';
        let timeoutId;

        const showStatus = (message, state) => {
          status.textContent = message;
          status.dataset.state = state;
        };

        if (configured) {
          form.action = scriptUrl;
          button.disabled = false;
        } else {
          showStatus('報名服務尚未設定，請先完成 Google Apps Script 部署。', 'error');
        }

        form.addEventListener('submit', (event) => {
          if (!configured) {
            event.preventDefault();
            return;
          }

          pendingRequestId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          requestIdInput.value = pendingRequestId;
          button.disabled = true;
          showStatus('資料送出中，請稍候…', '');
          timeoutId = window.setTimeout(() => {
            if (pendingRequestId) {
              pendingRequestId = '';
              button.disabled = false;
              showStatus('目前未收到服務回覆，請稍後確認報名資料是否已送達，再重新送出。', 'error');
            }
          }, 20000);
        });

        window.addEventListener('message', (event) => {
          if (event.source !== frame.contentWindow || !event.data || event.data.type !== 'signup-result') {
            return;
          }
          if (!pendingRequestId || event.data.requestId !== pendingRequestId) {
            return;
          }

          window.clearTimeout(timeoutId);
          pendingRequestId = '';
          button.disabled = false;
          if (event.data.status === 'success') {
            form.reset();
            showStatus('報名成功！我們已收到你的資料。', 'success');
          } else {
            showStatus('報名未完成，請檢查資料後再試一次；若問題持續，請聯絡活動主辦單位。', 'error');
          }
        });
      })();
    </script>
  </body>
</html>
